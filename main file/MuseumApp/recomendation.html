<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolfsonian Area Recomendation</title>
  <meta name="description" content="What Wolfsonian Area Would Be Best For You." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="canonical" href="https://Wolfsonianrecomend.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wolfsonian Area Recomendation" />
  <meta property="og:title" content="Wolfsonian Area Recomendation" />
  <meta property="og:description" content="What Wolfsonian Area Would Be Best For You." />
  <meta property="og:url" content="https://Wolfsonianrecomend.com/" />
  <meta property="og:image" content="https://Wolfsonianrecomend.com/og-image.png" />
  <script type="application/ld+json">
  </script>
  <meta http-equiv="refresh" content="30; url=index.html" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="page-hero">
    <p class="eyebrow">THE WOLFSONIAN–FIU</p>
    <h1>Enjoy Your Visit</h1>
    <div id="result" class="recommendation-result"></div>
    <p><a href="index.html" class="btn">Back to Map</a></p>
    <p class="return-note">Returning automatically in 30 seconds.</p>
  </main>

  <script>
    // Show the questionnaire result passed from questionare.html
    const params = new URLSearchParams(window.location.search);
    const exhibit = params.get("exhibit");
    const exhibitLocation = params.get("location");

    if (exhibit) {
      const result = document.getElementById("result");

      const label = document.createElement("p");
      label.className = "return-note";
      label.textContent = "Your recommended exhibit:";

      const name = document.createElement("strong");
      name.textContent = exhibit;

      result.append(label, name);

      if (exhibitLocation) {
        const place = document.createElement("p");
        place.className = "exhibit-location";
        place.textContent = "Location: " + exhibitLocation;
        result.append(place);
      }
    }
  </script>

</body>


</html>
