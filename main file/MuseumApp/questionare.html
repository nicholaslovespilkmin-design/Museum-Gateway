<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
    <meta name="referrer" content="no-referrer">
    <title>Wolfsonian Visitor Questionnaire</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="questionnaire" id="ticket-step">

        <p class="eyebrow">THE WOLFSONIAN–FIU</p>
        <h1>Your Ticket</h1>
        <p class="ticket-note">Show this QR code at the entrance.</p>

        <div id="qrcode" class="qr-box"></div>
        <p id="ticket-number" class="ticket-number"></p>

        <button type="button" class="btn" id="continue-button">Continue</button>

    </main>

    <main class="questionnaire" id="questionnaire-step" style="display: none;">

        <p class="eyebrow">THE WOLFSONIAN–FIU</p>
        <h1>Find Your Exhibit</h1>

        <h2 id="question">
            Are you interested in fashion, identity, and personal style?
        </h2>

        <div id="buttons">
            <button type="button" class="btn" id="yes-button">Yes</button>
            <button type="button" class="btn btn-ghost" id="no-button">No</button>
        </div>

        <div id="result"></div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
            integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU"
            crossorigin="anonymous"></script>
    <script src="questionnaire.js"></script>
    <script src="ticket.js"></script>

</body>

</html>
