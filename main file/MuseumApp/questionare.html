<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wolfsonian Visitor Questionnaire</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="questionnaire" id="ticket-step">

        <p class="eyebrow">THE WOLFSONIAN–FIU</p>
        <h1>Your Ticket</h1>
        <p class="ticket-note">Show this QR code at the entrance.</p>

        <div id="qrcode" class="qr-box"></div>
        <p id="ticket-number" class="ticket-number"></p>

        <button class="btn" onclick="showQuestionnaire()">Continue</button>

    </main>

    <main class="questionnaire" id="questionnaire-step" style="display: none;">

        <p class="eyebrow">THE WOLFSONIAN–FIU</p>
        <h1>Find Your Exhibit</h1>

        <h2 id="question">
            Are you interested in fashion, identity, and personal style?
        </h2>

        <div id="buttons">
            <button class="btn" onclick="answerYes()">Yes</button>
            <button class="btn btn-ghost" onclick="answerNo()">No</button>
        </div>

        <div id="result"></div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="questionnaire.js"></script>

    <script>
        // Use the ticket number from checkout (the one emailed), or make one if missing
        const ticketNumber = new URLSearchParams(window.location.search).get("ticket") ||
            "WOLF-" + Date.now().toString(36).toUpperCase();
        document.getElementById("ticket-number").textContent = "Ticket " + ticketNumber;

        new QRCode(document.getElementById("qrcode"), {
            text: "The Wolfsonian-FIU Ticket " + ticketNumber,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff"
        });

        function showQuestionnaire() {
            document.getElementById("ticket-step").style.display = "none";
            document.getElementById("questionnaire-step").style.display = "block";
        }
    </script>

</body>

</html>
