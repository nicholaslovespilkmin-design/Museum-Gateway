<!DOCTYPE html>
<html>
<head>
    <title>Wolfsonian Museum Map</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .page {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            margin: 30px auto;
        }

        /* LEFT SIDE - MAP */
        .map-container {
            position: relative;
            width: 55%;
        }

        .map {
            width: 100%;
            display: block;
        }

        /* RIGHT SIDE */
        .controls {
            width: 35%;
            text-align: center;
        }

        .controls h1 {
            font-size: 55px;
            font-weight: normal;
            margin-bottom: 70px;
        }

        /* Gray buttons */
        .location-button {
            display: block;
            width: 100%;
            height: 85px;
            margin-bottom: 20px;

            background-color: #eeeeee;
            border: 1px solid #666;
            border-radius: 15px;

            font-size: 24px;
            cursor: pointer;
        }

        .location-button:hover {
            background-color: #dddddd;
        }

        /* Yellow ping */
        .ping {
            position: absolute;

            width: 25px;
            height: 25px;

            background-color: yellow;
            border: 3px solid #d6a900;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            display: none;

            box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7);

            animation: pingAnimation 1.5s infinite;
        }

        @keyframes pingAnimation {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7);
            }

            70% {
                box-shadow: 0 0 0 18px rgba(255, 215, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0);
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- MAP -->
        <div class="map-container">

            <img
                src="museum-map.png"
                class="map"
                alt="Wolfsonian museum map"
            >

            <!-- Yellow ping -->
            <div id="ping" class="ping"></div>

        </div>


        <!-- BUTTONS -->
        <div class="controls">

            <h1>
                Explore the<br>
                museum
            </h1>

            <button
                class="location-button"
                onclick="showLocation('deco')">
                The Deco Function Room
            </button>

            <button
                class="location-button"
                onclick="showLocation('american')">
                Early 20th-Century American
            </button>

            <button
                class="location-button"
                onclick="showLocation('starr')">
                Starr Gallery
            </button>

        </div>

    </div>


    <script>

        function showLocation(location) {

            const ping = document.getElementById("ping");

            ping.style.display = "block";

            if (location === "deco") {

                /*
                The Deco Function Room
                */
                ping.style.left = "18%";
                ping.style.top = "53%";

            }

            else if (location === "american") {

                /*
                Early 20th-Century American
                */
                ping.style.left = "35%";
                ping.style.top = "18%";

            }

            else if (location === "starr") {

                /*
                Starr Gallery
                */
                ping.style.left = "75%";
                ping.style.top = "68%";

            }
        }

    </script>

</body>
</html>
