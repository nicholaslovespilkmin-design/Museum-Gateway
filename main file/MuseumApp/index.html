<!DOCTYPE html>
<html>
<head>
    <title>Wolfsonian Museum Map</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .page {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            margin: 30px auto;
        }

        /* LEFT SIDE - MAP */
        .map-container {
            position: relative;
            width: 55%;
        }

        .map {
            width: 100%;
            display: block;
        }

        /* RIGHT SIDE */
        .controls {
            width: 35%;
            text-align: center;
        }

        .controls h1 {
            font-family: var(--font-serif);
            color: var(--navy);
            font-size: 55px;
            font-weight: normal;
            line-height: 1.1;
            margin-bottom: 70px;
        }

        .checkout-link {
            margin-top: 20px;
            padding: 16px 40px;
            font-size: 1.1rem;
        }

        /* Location buttons */
        .location-button {
            display: block;
            width: 100%;
            height: 85px;
            margin-bottom: 20px;

            background-color: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);

            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--navy);
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .location-button:hover {
            background-color: var(--sky);
            border-color: var(--blue-light);
        }

        /* Gold ping */
        .ping {
            position: absolute;

            width: 25px;
            height: 25px;

            background-color: var(--gold);
            border: 3px solid var(--gold-deep);

            border-radius: 50%;

            transform: translate(-50%, -50%);

            display: none;

            box-shadow: 0 0 0 0 rgba(243, 183, 59, 0.7);

            animation: pingAnimation 1.5s infinite;
        }

        @keyframes pingAnimation {
            0% {
                box-shadow: 0 0 0 0 rgba(243, 183, 59, 0.7);
            }

            70% {
                box-shadow: 0 0 0 18px rgba(243, 183, 59, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(243, 183, 59, 0);
            }
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- MAP -->
        <div class="map-container">

            <img
                src="museum-map.png"
                class="map"
                alt="Wolfsonian museum map"
            >

            <!-- Gold ping -->
            <div id="ping" class="ping"></div>

        </div>


        <!-- BUTTONS -->
        <div class="controls">

            <h1>
                Explore the<br>
                museum
            </h1>

            <button
                class="location-button"
                onclick="showLocation('deco')">
                The Deco Function Room
            </button>

            <button
                class="location-button"
                onclick="showLocation('american')">
                Early 20th-Century American
            </button>

            <button
                class="location-button"
                onclick="showLocation('starr')">
                Starr Gallery
            </button>

            <a href="checkout.html" class="btn btn-sun checkout-link">Buy Tickets</a>

        </div>

    </div>


    <script>

        function showLocation(location) {

            const ping = document.getElementById("ping");

            ping.style.display = "block";

            if (location === "deco") {

                /*
                The Deco Function Room
                */
                ping.style.left = "18%";
                ping.style.top = "53%";

            }

            else if (location === "american") {

                /*
                Early 20th-Century American
                */
                ping.style.left = "35%";
                ping.style.top = "18%";

            }

            else if (location === "starr") {

                /*
                Starr Gallery
                */
                ping.style.left = "75%";
                ping.style.top = "68%";

            }
        }

    </script>

</body>
</html>
